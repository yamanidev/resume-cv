name: Build and Release Resume

on:
  push:
    branches: [main]
    paths:
      - Mohamed_Yamani_resume.yaml
      - requirements.txt
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build resume
        run: rendercv render Mohamed_Yamani_resume.yaml

      - name: Release
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/latest"
          cat > release_notes.md << EOF
          View online: https://mohamedyamani.com/resume/

          [PDF](${BASE_URL}/Mohamed_Yamani_resume.pdf) — Download for print or sharing
          [Markdown](${BASE_URL}/Mohamed_Yamani_resume.md) — Plain text source
          EOF

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git tag -f latest
          git push -f origin latest
          gh release create latest \
            rendercv_output/Mohamed_Yamani_resume.pdf \
            rendercv_output/Mohamed_Yamani_resume.md \
            --title "Latest" --latest --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger website redeploy
        run: curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
