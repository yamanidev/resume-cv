name: Build and Release Resume

on:
  push:
    branches: [main]
    paths:
      - Mohamed_Yamani_resume.yaml
      - requirements.txt

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build resume
        run: rendercv render Mohamed_Yamani_resume.yaml

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: rendercv_output/*
          make_latest: true
